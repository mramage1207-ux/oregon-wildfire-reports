* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

/* ── Header ── */
#header { background: #16213e; padding: 10px 16px; display: flex; align-items: center;

#date-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
#date-controls label { font-size: 12px; color: #aaa; }
#date-select { background: #0f3460; color: #e8e8e8; border: 1px solid #e94560;
                border-radius: 4px; padding: 4px 8px; font-size: 13px; cursor: pointer; }
#date-slider { width: 180px; accent-color: #e94560; cursor: pointer; }
#totals-bar { font-size: 12px; color: #ccc; display: flex; gap: 12px; flex-wrap: wrap; }
.total-badge { padding: 3px 8px; border-radius: 3px; font-weight: 600; font-size: 11px; }
.badge-l1 { background: #1a5c2a; color: #90ee90; }
.badge-l2 { background: #5c4a00; color: #ffe066; }
.badge-l3 { background: #6b1515; color: #ffb3b3; }
.badge-total { background: #333; color: #fff; }

/* ── Layout ── */
#body { display: flex; flex: 1; overflow: hidden; }
#map { flex: 1; }

/* ── Side panel ── */
#panel { width: 300px; background: #16213e; border-left: 1px solid #0f3460;
          overflow-y: auto; flex-shrink: 0; display: flex; flex-direction: column; }
#panel-content { padding: 14px; flex: 1; }
#panel h2 { font-size: 14px; color: #e94560; margin-bottom: 10px; }
#panel h3 { font-size: 13px; color: #aaa; margin: 12px 0 6px; text-transform: uppercase;
             letter-spacing: 0.5px; }
.info-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.info-table td { padding: 5px 4px; border-bottom: 1px solid #0f3460; vertical-align: top; }
.info-table td:first-child { color: #aaa; width: 130px; }
.info-table td:last-child { color: #e8e8e8; font-weight: 500; }
.level-pill { display: inline-block; padding: 2px 10px; border-radius: 12px;
               font-size: 12px; font-weight: 700; margin-bottom: 10px; }
.pill-1 { background: #1e6b1e; color: #ffffff; }
.pill-2 { background: #7a6200; color: #ffffff; }
.pill-3 { background: #9c1c1c; color: #ffffff; }
.pill-0 { background: #333; color: #aaa; }
.hint { font-size: 12px; color: #666; margin-top: 8px; line-height: 1.5; }
.stale-note { font-size: 11px; color: #f0ad4e; margin-top: 6px; padding: 4px 8px;
               background: rgba(240,173,78,0.1); border-radius: 3px; }

/* ── Unmatched zones ── */
#unmatched-section { border-top: 1px solid #0f3460; padding: 14px; flex-shrink: 0; }
#unmatched-toggle { background: none; border: 1px solid #0f3460; color: #aaa; width: 100%;
                     padding: 6px; font-size: 12px; cursor: pointer; border-radius: 3px;
                     text-align: left; }
#unmatched-toggle:hover { background: #0f3460; }
#unmatched-list { display: none; margin-top: 8px; font-size: 12px; max-height: 180px;
                   overflow-y: auto; }
.unmatched-zone { padding: 4px 0; border-bottom: 1px solid #0f3460; color: #ccc; }
.unmatched-zone .uz-name { color: #e8e8e8; font-weight: 500; }

/* ── Legend ── */
#legend { padding: 12px 14px; border-top: 1px solid #0f3460; flex-shrink: 0; }
#legend h4 { font-size: 11px; color: #666; text-transform: uppercase; margin-bottom: 6px; }
.legend-item { display: flex; align-items: center; gap: 8px; font-size: 12px;
                color: #ccc; margin-bottom: 5px; }
.legend-swatch { width: 20px; height: 14px; border-radius: 2px; flex-shrink: 0; }
.legend-swatch.l1 { background: rgba(100,210,120,0.55); border: 1px solid #2d7a3d; }
.legend-swatch.l2 { background: rgba(255,230,80,0.55); border: 1px solid #c8940a; }
.legend-swatch.l3 { background: rgba(255,130,130,0.55); border: 1px solid #cc3333; }
.legend-swatch.zone { background: rgba(255,255,255,0.15); border: 2px dashed #fff; }
.legend-swatch.none { background: #d9d9d9; opacity: 0.8; border: 1px solid #999; }

/* ── Layer toggles ── */
#layer-toggles { padding: 10px 14px; border-top: 1px solid #0f3460; flex-shrink: 0; }
.layer-toggle { display: flex; align-items: center; gap: 8px; font-size: 12px;

.layer-toggle input { accent-color: #e94560; cursor: pointer; }
</style>

// ── Fetched-on-demand data (changed 2026-08-28 — see write_html_map()'s
// docstring in generate_evac_zip_report.py for the full rationale). Zone
// GeoJSON per date and the ZCTA boundary layer used to be embedded inline
// here; they're now loaded over the network from the same paths they're
// already published to (evac_zone_geometry/), which stops this file from
// growing by ~1.5MB every single day. ZCTA_GEOJSON is fetched once and
// cached; each date's zone GeoJSON is fetched the first time it's viewed and
// cached in ZONE_CACHE for the rest of the page session.
let ZCTA_GEOJSON = null;
const ZONE_CACHE = {};   // date -> parsed GeoJSON (or null if fetch failed/missing)

async function loadZcta() {
  const res = await fetch('evac_zone_geometry/oregon_zcta_boundaries.geojson');
  if (!res.ok) throw new Error(`ZCTA boundaries fetch failed: HTTP ${res.status}`);
  return res.json();
}

async function loadZoneData(date) {
  if (Object.prototype.hasOwnProperty.call(ZONE_CACHE, date)) return ZONE_CACHE[date];
  try {
    const res = await fetch(`evac_zone_geometry/evac_zones_${date}.geojson`);
    ZONE_CACHE[date] = res.ok ? await res.json() : null;
  } catch (e) {
    ZONE_CACHE[date] = null;
  }
  return ZONE_CACHE[date];
}

// ── Constants ─────────────────────────────────────────────────────────────────
const LEVEL_FILL   = { 1:'rgba(100,210,120,0.5)', 2:'rgba(255,230,80,0.5)', 3:'rgba(255,130,130,0.5)' };
const LEVEL_BORDER = { 1:'#2d7a3d', 2:'#c8940a', 3:'#cc3333' };
const LEVEL_LABELS = { 1:'Level 1 — GET READY', 2:'Level 2 — GET SET', 3:'Level 3 — GO NOW' };
const PILL_CLASS   = { 1:'pill-1', 2:'pill-2', 3:'pill-3' };

// ── Build ZIP→evac lookup per date ────────────────────────────────────────────
const ZIP_LOOKUP = {};
for (const date of Object.keys(DAILY_ZIP)) {
  ZIP_LOOKUP[date] = {};
  for (const z of (DAILY_ZIP[date].zips || [])) ZIP_LOOKUP[date][z.zip] = z;
}

// ── Map setup ─────────────────────────────────────────────────────────────────
// Basemap changed 2026-08-05 per Matt: the dark "dark_all" CartoDB basemap read as a
// wall of black wherever no ZIP polygon or zone covered the tile (map edges, gaps,
// low zoom) — switched to the light "light_all" (Positron) basemap instead, so no
// black base layer shows through anywhere on the map, matching the older
// pre-date-slider evac-map.html which used this same light basemap.
//
// Basemap changed AGAIN 2026-08-27: Carto began enforcing an API-key requirement
// on the free basemaps.cartocdn.com raster endpoint around 2026-08-26 — every
// unauthenticated tile request now returns a watermarked "API KEY REQUIRED" image
// instead of an actual map tile (confirmed via web search: this hit other unrelated
// public projects, e.g. Home Assistant, the same week). Matt caught this live via a
// screenshot of the public site showing the watermark tiled across the whole map.
// Switched to the standard OpenStreetMap tile server, which requires no account, no
// key, and no signup — the tradeoff is losing the minimalist light-gray "Positron"
// look (OSM's default tiles are the familiar colorful streets-and-labels style, with
// real ground color everywhere) but the "wall of black on uncovered areas" problem
// that originally motivated the light-basemap switch cannot recur here either way,
// since OSM's default tiles have real terrain/street color at every zoom level, not
// a blank/dark fill. If Matt later wants the Positron look back, that requires a free
// Carto API key (signup at carto.com/basemaps/apikey, up to 5M tile requests/month
// free) added to this URL — not done here since account creation is something Matt
// needs to do himself.
const map = L.map('map', { zoomControl: true }).setView([44.1, -120.5], 7);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap contributors',
  subdomains: 'abc', maxZoom: 19,
}).addTo(map);

// ── State ─────────────────────────────────────────────────────────────────────
const dates  = HISTORY.map(h => h.date).sort();
let curDate  = dates[dates.length - 1];
// Split into two independent layers 2026-08-05 per Matt — previously one combined
// "ZIP Code layer" toggle controlled impacted and non-impacted ZIPs together.
let zctaImpactedLayer = null, zctaNonImpactedLayer = null, zoneLayer = null;
let showZctaImpacted = true, showZctaNonImpacted = true, showZones = true;

// ── Date selector ─────────────────────────────────────────────────────────────
const dateSelect = document.getElementById('date-select');
const dateSlider = document.getElementById('date-slider');
dateSlider.max = dates.length - 1;
dateSlider.value = dates.length - 1;
for (const d of [...dates].reverse()) {
  const opt = document.createElement('option');
  opt.value = d; opt.textContent = d; if (d === curDate) opt.selected = true;
  dateSelect.appendChild(opt);
}
dateSelect.addEventListener('change', () => {
  curDate = dateSelect.value;
  dateSlider.value = dates.indexOf(curDate);
  renderAll(curDate);
});
dateSlider.addEventListener('input', () => {
  curDate = dates[parseInt(dateSlider.value)];
  dateSelect.value = curDate;
  renderAll(curDate);
});

// ── Layer toggles ─────────────────────────────────────────────────────────────
document.getElementById('toggle-zcta-impacted').addEventListener('change', e => {
  showZctaImpacted = e.target.checked;
  if (showZctaImpacted && zctaImpactedLayer) zctaImpactedLayer.addTo(map);
  else if (!showZctaImpacted && zctaImpactedLayer) map.removeLayer(zctaImpactedLayer);
});
document.getElementById('toggle-zcta-nonimpacted').addEventListener('change', e => {
  showZctaNonImpacted = e.target.checked;
  if (showZctaNonImpacted && zctaNonImpactedLayer) zctaNonImpactedLayer.addTo(map);
  else if (!showZctaNonImpacted && zctaNonImpactedLayer) map.removeLayer(zctaNonImpactedLayer);
});
document.getElementById('toggle-zones').addEventListener('change', e => {
  showZones = e.target.checked;
  if (showZones && zoneLayer) zoneLayer.addTo(map);
  else if (!showZones && zoneLayer) map.removeLayer(zoneLayer);
});

// ── Totals bar ────────────────────────────────────────────────────────────────
function updateTotalsBar(date) {
  const h = HISTORY.find(x => x.date === date);
  if (!h) return;
  document.getElementById('badge-l1').textContent = `L1: ${(h.l1||0).toLocaleString()}`;
  document.getElementById('badge-l2').textContent = `L2: ${(h.l2||0).toLocaleString()}`;
  document.getElementById('badge-l3').textContent = `L3: ${(h.l3||0).toLocaleString()}`;
  document.getElementById('badge-total').textContent = `Total: ${(h.total||0).toLocaleString()} addr`;
}

// ── ZCTA layer ────────────────────────────────────────────────────────────────
// Split 2026-08-05 into two independent Leaflet layers (impacted / non-impacted) so
// each can be toggled on/off separately — was one combined layer under a single
// "ZIP Code layer" checkbox, which meant hiding one hid both.
function renderZctaLayer(date) {
  if (zctaImpactedLayer) map.removeLayer(zctaImpactedLayer);
  if (zctaNonImpactedLayer) map.removeLayer(zctaNonImpactedLayer);
  const zipEvac = ZIP_LOOKUP[date] || {};

  zctaImpactedLayer = L.geoJSON(ZCTA_GEOJSON, {
    filter: f => !!zipEvac[f.properties.zip],
    style: f => {
      const z = zipEvac[f.properties.zip];
      const lv = z.peak_level;
      return { fillColor:LEVEL_FILL[lv], fillOpacity:1, color:LEVEL_BORDER[lv], weight:1.2, opacity:0.9 };
    },
    onEachFeature: (f, layer) => {
      layer.on('click', e => {
        L.DomEvent.stopPropagation(e);
        showZipPanel(f.properties.zip, date);
      });
      layer.on('mouseover', () => {
        layer.setStyle({ weight:2.5, fillOpacity:0.85 });
      });
      layer.on('mouseout', () => {
        zctaImpactedLayer.resetStyle(layer);
      });
    },
  });

  // Non-impacted ZIPs: light grey fill (changed 2026-08-05 per Matt's request — the
  // previous fillOpacity:0 let the dark CartoDB basemap show through unimpacted ZIPs,
  // which read as a distracting wall of black across most of the state. Kept this
  // light grey — confirmed with Matt — even after the basemap itself was separately
  // switched from dark to light that same day).
  zctaNonImpactedLayer = L.geoJSON(ZCTA_GEOJSON, {
    filter: f => !zipEvac[f.properties.zip],
    style: f => ({ fillColor:'#d9d9d9', fillOpacity:0.8, color:'#999', weight:0.4, opacity:0.5 }),
    onEachFeature: (f, layer) => {
      layer.on('click', e => {
        L.DomEvent.stopPropagation(e);
        showZipPanel(f.properties.zip, date);
      });
    },
  });

  if (showZctaImpacted) zctaImpactedLayer.addTo(map);
  if (showZctaNonImpacted) zctaNonImpactedLayer.addTo(map);
}

// ── OEM zone layer ────────────────────────────────────────────────────────────
// Async since 2026-08-28: zone GeoJSON for a date is now fetched on demand
// (see loadZoneData above) rather than being embedded ahead of time. Checks
// `date !== curDate` after the await so that if the user drags the slider
// past this date before its fetch resolves, the stale response is discarded
// instead of clobbering whatever date's layer is now current.
async function renderZoneLayer(date) {
  const zoneData = await loadZoneData(date);
  if (date !== curDate) return;  // user moved on before this fetch resolved
  if (zoneLayer) map.removeLayer(zoneLayer);
  if (!zoneData) return;
  zoneLayer = L.geoJSON(zoneData, {
    style: f => {
      const lv  = f.properties.level;
      const cached = f.properties.geometry_source === 'cached';
      return {
        fillColor: LEVEL_BORDER[lv] || '#aaa',
        fillOpacity: 0.18,
        color: LEVEL_BORDER[lv] || '#aaa',
        weight: 2,
        opacity: 0.9,
        dashArray: cached ? '6,4' : null,
      };
    },
    onEachFeature: (f, layer) => {
      layer.on('click', e => {
        L.DomEvent.stopPropagation(e);
        showZonePanel(f.properties, date);
      });
      layer.on('mouseover', () => layer.setStyle({ fillOpacity:0.4, weight:3 }));
      layer.on('mouseout', () => zoneLayer.resetStyle(layer));
    },
  });
  if (showZones) zoneLayer.addTo(map);
}

// ── Unmatched zones panel ────────────────────────────────────────────────────
function renderUnmatchedPanel(date) {
  const data = DAILY_ZIP[date];
  const zones = data ? (data.unmatched_zones || []) : [];
  const btn = document.getElementById('unmatched-toggle');
  const list = document.getElementById('unmatched-list');
  btn.textContent = `⚠ Unmatched zones (${zones.length})`;
  list.style.display = 'none';
  list.innerHTML = '';
  if (!zones.length) return;
  btn.onclick = () => { list.style.display = list.style.display === 'none' ? 'block' : 'none'; };
  for (const z of zones.sort((a,b) => b.addresses - a.addresses)) {
    const lbl = LEVEL_LABELS[z.level] || `Level ${z.level}`;
    list.innerHTML += `<div class="unmatched-zone">
      <div class="uz-name">${z.zone_name}</div>
      <div>${lbl} · ${(z.addresses||0).toLocaleString()} addr · ${z.fire_name||''}</div>
    </div>`;
  }
}

// ── Info panels ───────────────────────────────────────────────────────────────
function pillHtml(level) {
  if (!level) return '';
  const cls = PILL_CLASS[level] || 'pill-0';
  return `<span class="level-pill ${cls}">${LEVEL_LABELS[level] || 'Level '+level}</span>`;
}

function showZipPanel(zip, date) {
  const z = (ZIP_LOOKUP[date] || {})[zip];
  const pc = document.getElementById('panel-content');
  if (!z) {
    pc.innerHTML = `<h2>ZIP ${zip}</h2><p class="hint" style="margin-top:8px">No evacuations on ${date}.</p>`;
    return;
  }
  pc.innerHTML = `
    <h2>ZIP ${zip}</h2>
    ${pillHtml(z.peak_level)}
    <table class="info-table" style="margin-top:8px">
      <tr><td>Level 1 — GET READY</td><td>${(z.l1||0).toLocaleString()} addr</td></tr>
      <tr><td>Level 2 — GET SET</td><td>${(z.l2||0).toLocaleString()} addr</td></tr>
      <tr><td>Level 3 — GO NOW</td><td>${(z.l3||0).toLocaleString()} addr</td></tr>
      <tr><td>Total</td><td>${(z.total||0).toLocaleString()} addr</td></tr>
      <tr><td>Counties</td><td>${z.counties || '—'}</td></tr>
      <tr><td>Fire(s)</td><td>${z.fires || '—'}</td></tr>
    </table>`;
}

function showZonePanel(props, date) {
  const pc = document.getElementById('panel-content');
  const zipList = (props.overlapping_zips || [])
    .map(o => `${o.zip} (${o.fraction_pct!=null ? o.fraction_pct.toFixed(1)+'%' : ''})`)
    .join(', ');
  const staleHtml = props.geometry_source === 'cached'
    ? `<div class="stale-note">⚠ Geometry from cache (${props.geometry_cache_age_days||'?'} day(s) old)</div>` : '';
  const unmatchedHtml = props.unmatched_addresses > 0
    ? `<tr><td>Unplaced addresses</td><td style="color:#f0ad4e">${props.unmatched_addresses.toLocaleString()} (${(props.unmatched_fraction_pct||0).toFixed(1)}% of zone)</td></tr>` : '';
  pc.innerHTML = `
    <h2>OEM Evac Zone</h2>
    <div style="font-weight:700; font-size:14px; margin-bottom:8px">${props.zone_name}</div>
    ${pillHtml(props.level)}
    ${staleHtml}
    <table class="info-table" style="margin-top:8px">
      <tr><td>Fire</td><td>${props.fire_name || '—'}</td></tr>
      <tr><td>County</td><td>${props.county || '—'}</td></tr>
      <tr><td>Addresses in zone</td><td>${(props.addresses||0).toLocaleString()}</td></tr>
      ${unmatchedHtml}
      <tr><td>Overlapping ZIPs</td><td>${zipList || 'None matched'}</td></tr>
    </table>`;
}

// ── Master render ─────────────────────────────────────────────────────────────
async function renderAll(date) {
  renderZctaLayer(date);
  renderUnmatchedPanel(date);
  updateTotalsBar(date);
  await renderZoneLayer(date);   // fetches this date's zone GeoJSON if not cached
}

// ── Boot ──────────────────────────────────────────────────────────────────────
// ZCTA boundaries are fetched once, up front, since every date's choropleth
// needs them; the initial date's zone GeoJSON is then fetched as part of the
// normal renderAll() flow above, same as any later date change.
async function init() {
  document.getElementById('panel-content').innerHTML =
    '<h2>Evacuation Details</h2><p class="hint">Loading map data…</p>';
  try {
    ZCTA_GEOJSON = await loadZcta();
  } catch (e) {
    document.getElementById('panel-content').innerHTML =
      '<h2>Evacuation Details</h2><p class="hint">Failed to load ZIP boundary data — try reloading the page.</p>';
    return;
  }
  document.getElementById('panel-content').innerHTML =
    '<h2>Evacuation Details</h2><p class="hint">Click a ZIP code or OEM zone on the map to see details here.</p>';
  await renderAll(curDate);
}
init();
</script>
</body>
